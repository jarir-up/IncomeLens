name: gates

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  checks:
    # Runs on description edits too: a skipped run would count as passing.
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:0.8.0-pg17
        env:
          POSTGRES_USER: pakkifile
          POSTGRES_PASSWORD: pakkifile
          POSTGRES_DB: pakkifile
        ports:
          - "5433:5432"
        options: --health-cmd "pg_isready -U pakkifile" --health-interval 2s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
          python-version: "3.12"
      - run: uv sync --frozen
      - run: ./scripts/check.sh

  rules:
    # Also re-runs when the PR description is edited, so a new waiver takes effect.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/rules_gate.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RULES_GATE_MODEL: ${{ vars.RULES_GATE_MODEL }}
          BASE_REF: ${{ github.base_ref }}
