<h2>Mandatory documents</h2>
<p>The following are mandatory documents and must be submitted from the outset:</p>
<ul>
<li>Past degree certificates (school, bachelor or past master degrees)</li>
<li>Degree transcripts</li>
<li>Proof of payment of tuition fees (if applicable to the course of study)</li>
</ul>
