[project]
name = "pakkifile"
version = "0.0.0"
description = "Open-source, local-first evidence compiler for freelancers' visa, loan and rental files."
license = "AGPL-3.0-only"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jinja2>=3.1.6",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.2",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.1.6",
]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "types-pyyaml>=6.0.12.20261030",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# The formatter owns line length; long f-strings it cannot split are fine.
ignore = ["E501"]

[tool.mypy]
strict = true
files = ["src", "tests", "evaldata"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
